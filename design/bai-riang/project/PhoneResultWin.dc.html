<x-dc>
<helmet>

<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: #0b1a2b; color: #eaf2f6; font-family: 'Sarabun', sans-serif;">
  <section style="display: flex; flex-direction: column; gap: 4px; padding-top: 72px;">

    <div style="display: flex; align-items: center; gap: 6px; font-size: 17px; color: #9db4c4;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.6-9.5 9-9.5 9z" fill="#ff6b4a"></path></svg>
      เหลือ 1 ชีวิต
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 15px; color: #9db4c4; font-weight: 700;">ทีม</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 44px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 14px; font-weight: 700;">มีนา</div>
      <div style="height: 44px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 14px; font-weight: 700;">Arm</div>
      <div style="height: 44px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 14px; font-weight: 700;">ต้น</div>
      <div style="height: 44px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 14px; font-weight: 700; color: #ffc83d;">ฝน (คุณ)</div>
    </div>
  </section>

  <div style="flex-grow: 1;"></div>
  <section style="display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 72px; border-radius: 18px; border: none; background: #ffc83d; color: #0b1a2b; font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 700;">เล่นอีกครั้ง</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="height: 56px; border-radius: 14px; border: 2px solid #27425c; background: #12263b; color: #eaf2f6; font-family: 'Kanit', sans-serif; font-size: 17px; font-weight: 700;">ดูลำดับที่เปิด</button>
      <button style="height: 56px; border-radius: 14px; border: 2px solid #27425c; background: #12263b; color: #eaf2f6; font-family: 'Kanit', sans-serif; font-size: 17px; font-weight: 700;">กลับไปหน้าเกม</button>
    </div>
  </section>

</x-dc>
