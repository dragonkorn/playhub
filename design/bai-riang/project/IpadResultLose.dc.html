<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>PlayHub iPad ผล ทีมแพ้</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b1a2b}
a{color:#ffc83d}a:hover{color:#ffe08a}
</style>
</helmet>
<main style="width: 1180px; height: 820px; box-sizing: border-box; padding: 56px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; align-items: center; background: #0b1a2b; color: #eaf2f6; font-family: 'Sarabun', sans-serif;">
  <section style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 24px; color: #ffc83d; font-weight: 700;">ชีวิตหมดที่ด่าน 2</span>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 96px; line-height: 1.05;">ทีมแพ้</h1>
  </section>

  <section style="display: flex; flex-direction: column; gap: 12px;">
    <span style="font-size: 18px; color: #9db4c4; font-weight: 700;">ทีม</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 40px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 16px; font-weight: 700; font-size: 17px;">มีนา</div>
      <div style="height: 40px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 16px; font-weight: 700; font-size: 17px;">Arm</div>
      <div style="height: 40px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 16px; font-weight: 700; font-size: 17px;">ต้น</div>
      <div style="height: 40px; border-radius: 10px; background: #12263b; display: flex; align-items: center; padding: 0 16px; font-weight: 700; font-size: 17px; color: #ffc83d;">ฝน (คุณ)</div>
    </div>
    <button style="margin-top: 10px; height: 80px; border-radius: 18px; border: none; background: #ffc83d; color: #0b1a2b; font-family: 'Kanit', sans-serif; font-size: 24px; font-weight: 700;">เล่นอีกครั้ง</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="height: 64px; border-radius: 14px; border: 2px solid #27425c; background: #12263b; color: #eaf2f6; font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 700;">ดูลำดับที่เปิด</button>
      <button style="height: 64px; border-radius: 14px; border: 2px solid #27425c; background: #12263b; color: #eaf2f6; font-family: 'Kanit', sans-serif; font-size: 20px; font-weight: 700;">กลับไปหน้าเกม</button>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
