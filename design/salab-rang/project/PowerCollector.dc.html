<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง พลังคนเก็บค่าที่</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">เก็บค่าที่!</h1>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <section aria-live="polite" style="flex-grow: 1; border-radius: 20px; background: #2c2456; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px;">
    <p style="margin: 0; text-align: center; font-size: 16px; line-height: 1.5;">ทุกคนที่มีเหรียญมากกว่าคุณ (6)<br>จ่ายค่าที่คนละ 1 เหรียญ</p>
    <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{payers}}" as="p" hint-placeholder-count="4">
        <li style="height: 52px; border-radius: 12px; background: #3a1d18; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 17px;">
          <span>{{p.n}}</span>
          <span style="font-family: 'Kanit', sans-serif; font-size: 22px; color: #ff8f6b;">−1</span>
        </li>
      </sc-for>
    </ul>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <span style="font-size: 15px; color: #cfc6ee;">คุณเก็บได้</span>
      <span style="display: flex; align-items: center; gap: 8px; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #ffd76a;">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
        +4
      </span>
    </div>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #b3a9d6;">แพรและฟ้ามี 6 เท่ากับคุณ ไม่ต้องจ่าย</p>
  </section>

  <button style="height: 64px; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">จบตา</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      payers: [{ n: 'ก้อง' }, { n: 'บอส' }, { n: 'จูน' }, { n: 'นัท' }],
      rows: [
        { n: 'ฉัน', c: 10, me: true, turn: true },
        { n: 'ก้อง', c: 8 },
        { n: 'มายด์', c: 4 },
        { n: 'บอส', c: 12, crown: true, near: true },
        { n: 'แพร', c: 6, shield: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 7, lock: true },
        { n: 'เบียร์ช้างน้อย', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
