<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง ล็อบบี้</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 12px; height: 44px;">
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 26px; flex-grow: 1;">ห้องรอ สลับร่าง</h1>
    <button style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #b3a9d6; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 16px;">ออก</button>
  </header>

  <section style="border-radius: 16px; background: #211b40; padding: 14px 16px; display: flex; align-items: center; gap: 16px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 14px; color: #b3a9d6; font-weight: 700;">รหัสห้อง</span>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 44px; letter-spacing: 6px; line-height: 1.1;">K7Q2</span>
      <span style="font-size: 13px; color: #b3a9d6;">สแกนเพื่อเข้าร่วม หรือกรอกรหัส</span>
    </div>
    <div role="img" aria-label="QR สำหรับเข้าห้อง" style="width: 92px; height: 92px; border-radius: 12px; background: #f3eefe; color: #15112b; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">[QR]</div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 15px; color: #b3a9d6; font-weight: 700;">ผู้เล่น 7 จาก 10 · นั่งเรียงตามเลขนี้ในวงจริง</span>
    <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{seats}}" as="s" hint-placeholder-count="7">
        <li style="height: 40px; border-radius: 10px; background: #211b40; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 700;">
          <span style="width: 22px; font-family: 'Kanit', sans-serif; color: #ffb547;">{{s.no}}</span>
          <span style="width: 8px; height: 8px; border-radius: 4px; background: #3ddc97;"></span>
          <span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{s.name}}</span>
          <span style="font-size: 13px; color: #b3a9d6; font-weight: 500;">{{s.tag}}</span>
        </li>
      </sc-for>
    </ol>
  </section>

  <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px;">
    <legend style="padding: 0 0 8px; font-size: 15px; color: #b3a9d6; font-weight: 700;">ชุดการ์ด</legend>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <label style="height: 70px; box-sizing: border-box; border-radius: 12px; border: 2px solid #3a3266; background: #211b40; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;">
        <input type="radio" name="set" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px;">เริ่มต้น</span>
        <span style="font-size: 12px; color: #cfc6ee;">เข้าใจง่าย</span>
      </label>
      <label style="height: 70px; box-sizing: border-box; border-radius: 12px; border: 2px solid #3a3266; background: #211b40; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;">
        <input type="radio" name="set" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px;">วุ่นวาย</span>
        <span style="font-size: 12px; color: #cfc6ee;">ป่วนสุดฮา</span>
      </label>
      <label style="height: 70px; box-sizing: border-box; border-radius: 12px; border: 2px solid #3a3266; background: #211b40; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;">
        <input type="radio" name="set" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px;">สุ่ม</span>
        <span style="font-size: 12px; color: #cfc6ee;">ไม่ซ้ำทุกเกม</span>
      </label>
      <label style="height: 70px; box-sizing: border-box; border-radius: 12px; border: 3px solid #ffb547; background: #3b2a1c; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;">
        <input type="radio" name="set" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px;">กำหนดเอง</span>
        <span style="font-size: 12px; color: #e3dcf7;">เลือกทีละตัว</span>
      </label>
    </div>
    <button style="height: 52px; border-radius: 12px; border: 2px solid #ffb547; background: transparent; color: #ffd28a; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>
      เลือกตัวละคร · 7 จาก 7 ใบ
    </button>
  </fieldset>

  <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column;">
    <legend style="padding: 0 0 8px; font-size: 15px; color: #b3a9d6; font-weight: 700;">เหรียญเป้าหมาย</legend>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <label style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 2px solid #3a3266; background: #211b40; display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px;"><input type="radio" name="goal" style="position: absolute; opacity: 0; width: 1px; height: 1px;">12</label>
      <label style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 3px solid #ffb547; background: #3b2a1c; display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px;"><input type="radio" name="goal" checked style="position: absolute; opacity: 0; width: 1px; height: 1px;">15</label>
      <label style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 2px solid #3a3266; background: #211b40; display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px;"><input type="radio" name="goal" style="position: absolute; opacity: 0; width: 1px; height: 1px;">20</label>
    </div>
  </fieldset>

  <div style="flex-grow: 1;"></div>
  <section style="display: flex; flex-direction: column; gap: 8px;">
    <button style="height: 68px; border-radius: 18px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 700;">เริ่มเกม</button>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #b3a9d6;">เจ้าห้องเท่านั้นที่เริ่มเกมหรือเปลี่ยนการตั้งค่าได้</p>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['มีนา', 'ก้อง', 'มายด์', 'บอส', 'เบียร์ช้างน้อย', 'ต้น', 'จูน'];
    return {
      seats: names.map(function (n, i) {
        return { no: String(i + 1), name: n, tag: i === 0 ? 'เจ้าห้อง' : '' };
      })
    };
  }
}
</script>
</body>
</html>
