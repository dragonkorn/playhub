<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง พลังนักมายากล</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="5" width="10" height="12" rx="1"></rect><path d="M7 10h10"></path><path d="M3 19h18"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">นักมายากลร่ายมนตร์!</h1>
  </header>

  <p style="margin: 0; text-align: center; font-size: 16px; color: #cfc6ee;">นัทใช้พลังนักมายากล · ทุกเครื่องเห็นจอนี้</p>

  <section aria-label="การ์ดทุกใบขยับไปคนถัดไปตามลำดับตา" style="position: relative; align-self: center; width: 330px; height: 330px;">
    <svg style="position: absolute; left: 0; top: 0;" width="330" height="330" viewBox="0 0 330 330" fill="none" aria-hidden="true">
      <circle cx="165" cy="165" r="128" stroke="#ffb547" stroke-width="3" stroke-dasharray="10 10"></circle>
    </svg>
    <div style="position: absolute; left: 115px; top: 115px; width: 100px; height: 100px; border-radius: 50%; background: #2c2456; color: #ffb547; display: flex; align-items: center; justify-content: center;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>
    </div>
    <sc-for list="{{seats}}" as="s" hint-placeholder-count="10">
      <span style="position: absolute; left: {{s.x}}; top: {{s.y}}; width: 60px; height: 60px; box-sizing: border-box; border-radius: 50%; border: {{s.border}}; background: {{s.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; line-height: 1.15; text-align: center;">
        <span style="max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: {{s.color}};">{{s.n}}</span>
        <span style="font-size: 11px; color: #c4ecff;">{{s.note}}</span>
      </span>
    </sc-for>
  </section>

  <section style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;">
    <p style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.35;">การ์ดทุกใบส่งให้คนถัดไป<br>ตามลำดับตา</p>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #cfc6ee;">แพรได้รับพร การ์ดไม่ขยับ ข้ามไปคนถัดไป<br>ตอนนี้คุณไม่ใช่ตัวเดิมแล้ว</p>
  </section>

  <p style="margin: 0; height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3a3266; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 17px; color: #cfc6ee;">
    นัทรับ +1 เหรียญ · ต่อไป: ตาของฉัน
  </p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var names = ['ฉัน', 'ก้อง', 'มายด์', 'บอส', 'แพร', 'ต้น', 'จูน', 'เบียร์ช้างน้อย', 'ฟ้า', 'นัท'];
    return {
      seats: names.map(function (n, i) {
        var a = -Math.PI / 2 + i * 2 * Math.PI / names.length;
        var blessed = n === 'แพร';
        return {
          n: n,
          note: blessed ? 'ไม่ขยับ' : '',
          x: Math.round(165 + 128 * Math.cos(a) - 30) + 'px',
          y: Math.round(165 + 128 * Math.sin(a) - 30) + 'px',
          border: blessed ? '3px solid #5cc8ff' : (n === 'นัท' ? '3px solid #ffb547' : '2px solid #3a3266'),
          bg: blessed ? '#173049' : (n === 'นัท' ? '#3b2a1c' : '#211b40'),
          color: n === 'ฉัน' ? '#ffd28a' : '#f3eefe'
        };
      })
    };
  }
}
</script>
</body>
</html>
