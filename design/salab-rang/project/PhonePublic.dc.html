<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง ผลที่ทุกคนเห็น</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; height: 44px;">
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">รอบ 2<span style="color: #b3a9d6; font-weight: 500;">/4</span> <span style="color: #b3a9d6; font-weight: 500; font-size: 16px;">· เป้า 15</span></h1>
    <button aria-label="ประวัติ" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    </button>
    <button aria-label="คู่มือตัวละคร" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"></path><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"></path></svg>
    </button>
    <button aria-label="ปิดเสียง" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
    </button>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <section aria-live="polite" style="flex-grow: 1; border-radius: 20px; background: #2c2456; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;">
    <h2 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 36px; line-height: 1.1; color: #ffd28a;">จับได้คาหนังคาเขา!</h2>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <span style="width: 72px; height: 72px; border-radius: 50%; background: #4a201a; border: 3px solid #ff8f6b; display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 24px;">ต้น</span>
        <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px; color: #ff8f6b;">−3</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="display: flex; gap: 2px;" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
        </span>
        <svg width="72" height="24" viewBox="0 0 72 24" fill="none" stroke="#ffd76a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h62"></path><path d="M58 5l8 7-8 7"></path></svg>
      </div>
      <div style="width: 100px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <span style="width: 72px; height: 72px; border-radius: 50%; background: #173049; border: 3px solid #5cc8ff; display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 24px;">จูน</span>
        <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px; color: #5cc8ff;">+3</span>
      </div>
    </div>

    <p style="margin: 0; font-size: 17px; line-height: 1.5;">ต้นอ้างเป็น<b>นักล้วงกระเป๋า</b> ไปล้วงจูน<br>แต่จูนคือ<b style="color: #5cc8ff;">ตำรวจตัวจริง</b><br>ต้นเลยต้องจ่ายจูน 3 เหรียญ</p>
  </section>

  <footer style="height: 64px; box-sizing: border-box; border-radius: 16px; border: 2px solid #3a3266; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 18px; color: #cfc6ee;">
    ต่อไป: ตาของจูน
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 8, me: true },
        { n: 'ก้อง', c: 8 },
        { n: 'มายด์', c: 4 },
        { n: 'บอส', c: 13, crown: true, near: true },
        { n: 'แพร', c: 6, shield: true },
        { n: 'ต้น', c: 2, turn: true },
        { n: 'จูน', c: 11, lock: true },
        { n: 'เบียร์', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
