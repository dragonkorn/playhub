<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง ผลลับ หมอดู</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="7"></circle><path d="M9 8a3 3 0 0 1 3-3"></path><path d="M7 16.5 5.5 21h13L17 16.5"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">หมอดูเห็น…</h1>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <p style="margin: 0; align-self: center; height: 36px; padding: 0 16px; border-radius: 18px; background: #3b2a1c; color: #ffd28a; display: flex; align-items: center; gap: 6px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px;">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
    +1 เหรียญ จากพลังหมอดู
  </p>

  <section style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <article aria-label="มายด์ คือ แม่ค้าส้มตำ" style="width: 160px; height: 224px; box-sizing: border-box; border-radius: 18px; border: 4px solid #5cc8ff; background: #fff3d6; color: #241a3d; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
        <div style="width: 84px; height: 84px; border-radius: 50%; background: #2b2150; color: #ffd76a; display: flex; align-items: center; justify-content: center;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 8c0-1.5 1-2 1-3.5"></path><path d="M12 8c0-1.5 1-2 1-3.5"></path><path d="M16 8c0-1.5 1-2 1-3.5"></path></svg>
        </div>
        <h2 style="margin: 0; text-align: center; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 24px; line-height: 1.15;">แม่ค้า<br>ส้มตำ</h2>
      </article>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px;">มายด์</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <article aria-label="บอส คือ หมาวัด" style="width: 160px; height: 224px; box-sizing: border-box; border-radius: 18px; border: 4px solid #5cc8ff; background: #fff3d6; color: #241a3d; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
        <div style="width: 84px; height: 84px; border-radius: 50%; background: #2b2150; color: #ffd76a; display: flex; align-items: center; justify-content: center;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="10" rx="2" ry="2.6"></ellipse><ellipse cx="10" cy="6" rx="2" ry="2.6"></ellipse><ellipse cx="14" cy="6" rx="2" ry="2.6"></ellipse><ellipse cx="18" cy="10" rx="2" ry="2.6"></ellipse><path d="M12 11c3 0 5.5 3.5 5.5 6a2.5 2.5 0 0 1-2.5 2.5c-1.2 0-1.8-.6-3-.6s-1.8.6-3 .6A2.5 2.5 0 0 1 6.5 17c0-2.5 2.5-6 5.5-6z"></path></svg>
        </div>
        <h2 style="margin: 0; text-align: center; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 24px; line-height: 1.15;">หมาวัด</h2>
      </article>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px;">บอส</span>
    </div>
  </section>

  <footer style="display: flex; flex-direction: column; gap: 8px;">
    <button style="height: 72px; border-radius: 16px; border: 3px solid #5cc8ff; background: #173049; color: #c4ecff; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      กำลังดู · ปล่อยนิ้วเพื่อซ่อน
    </button>
    <button style="height: 52px; border-radius: 14px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 17px;">ดูแล้ว จบตา</button>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 8, me: true, turn: true },
        { n: 'ก้อง', c: 8 },
        { n: 'มายด์', c: 4, picked: true },
        { n: 'บอส', c: 13, crown: true, near: true, picked: true },
        { n: 'แพร', c: 6, shield: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
