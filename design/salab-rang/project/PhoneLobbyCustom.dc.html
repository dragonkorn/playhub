<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง เลือกตัวละครเอง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; height: 44px;">
    <button style="height: 44px; padding: 0 12px 0 6px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      กลับ
    </button>
    <h1 style="margin: 0; flex-grow: 1; text-align: center; padding-right: 72px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">เลือกตัวละคร</h1>
  </header>

  <section style="display: flex; align-items: center; gap: 12px; border-radius: 14px; background: #211b40; padding: 10px 14px;">
    <span style="font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 32px; line-height: 1; color: #ffd28a;">6<span style="font-size: 20px; color: #b3a9d6;">/7</span></span>
    <span style="font-size: 14px; line-height: 1.4; color: #cfc6ee;">เลือกเท่าจำนวนผู้เล่น 7 คน<br>มีนักล้วงกระเป๋า ต้องมีตำรวจด้วย</span>
  </section>

  <fieldset style="margin: 0; padding: 0; border: none; flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 6px;">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden;">ตัวละครที่ใช้ในเกม</legend>
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="13">
      <label style="box-sizing: border-box; border-radius: 12px; border: {{r.border}}; background: {{r.bg}}; padding: 6px 10px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" checked="{{r.on}}" style="flex-shrink: 0; width: 20px; height: 20px; margin: 0; accent-color: #ffb547;">
        <span style="min-width: 0; display: flex; flex-direction: column;">
          <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.25;">{{r.name}}</span>
          <span style="font-size: 12px; line-height: 1.3; color: #cfc6ee;">{{r.power}}</span>
        </span>
      </label>
    </sc-for>
  </fieldset>

  <button disabled style="height: 60px; flex-shrink: 0; border-radius: 16px; border: none; background: #3a3266; color: #cfc6ee; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px;">เลือกอีก 1 ใบ</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['แม่ค้าส้มตำ', 'รับ 2 ลูกค้ารับ 1', true],
      ['นักล้วงกระเป๋า', 'ขโมย 2 จาก 1 คน', true],
      ['ตำรวจ', 'ค้นตัว เจอขโมยยึด 4', true],
      ['หมอดู', 'ดูการ์ด 2 คน รับ 1', true],
      ['หลวงพี่', 'ให้พร กันสลับ รับ 1', false],
      ['นักมายากล', 'การ์ดทั้งวงขยับ 1 ที่', true],
      ['คนเก็บค่าที่', 'เก็บ 1 จากคนที่รวยกว่า', false],
      ['ร่างทรง', 'จ่าย 1 ใช้พลังตัวอื่น', false],
      ['ป้าขี้เม้าท์', 'เปิดการ์ด 1 คนให้วงดู', true],
      ['นักเลงคุมซอย', 'เก็บ 1 ห้ามอ้างตาหน้า', false],
      ['หมอนวด', 'เก็บ 1 ให้เขาดูการ์ดตัวเอง', false],
      ['วินมอเตอร์ไซค์', 'ย้าย 2 เหรียญ รับ 1', false],
      ['หมาวัด', 'ไม่มีพลัง ถูกเปิดได้ 2', false]
    ];
    return {
      roles: list.map(function (r) {
        return {
          name: r[0],
          power: r[1],
          on: r[2],
          border: r[2] ? '3px solid #ffb547' : '2px solid #3a3266',
          bg: r[2] ? '#3b2a1c' : '#211b40'
        };
      })
    };
  }
}
</script>
</body>
</html>
