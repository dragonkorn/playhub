<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง ตลาดปิด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <section style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
    <p style="margin: 0; font-size: 15px; color: #b3a9d6;">ตลาดปิด · บอสเก็บครบ 15 เหรียญ</p>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="#ffd76a" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 44px; line-height: 1.1;">บอส ชนะ</h1>
    <p style="margin: 0; font-size: 15px; color: #ffd28a;">จบเกมในร่างหมาวัด</p>
  </section>

  <ol aria-label="อันดับ และการ์ดสุดท้าย" style="margin: 0; padding: 0; list-style: none; flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
    <sc-for list="{{ranks}}" as="r" hint-placeholder-count="10">
      <li style="height: 44px; box-sizing: border-box; border-radius: 10px; background: {{r.bg}}; padding: 0 12px; display: flex; align-items: center; gap: 10px;">
        <span style="width: 20px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 16px; color: #b3a9d6;">{{r.place}}</span>
        <span style="width: 64px; font-weight: 700; font-size: 16px; color: {{r.nameColor}};">{{r.name}}</span>
        <span style="flex-grow: 1; font-size: 14px; color: #cfc6ee;">{{r.card}}</span>
        <span style="display: flex; align-items: center; gap: 4px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px;">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
          {{r.coins}}
        </span>
      </li>
    </sc-for>
  </ol>

  <section style="display: flex; flex-direction: column; gap: 8px;">
    <button style="height: 52px; border-radius: 14px; border: 2px solid #8b7fd0; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 17px;">ดูประวัติทั้งเกม</button>
    <button style="height: 64px; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">เล่นอีกรอบ</button>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['บอส', 'หมาวัด', 15],
      ['จูน', 'ตำรวจ', 12],
      ['ฉัน', 'หมอดู', 10],
      ['นัท', 'นักมายากล', 9],
      ['ก้อง', 'แม่ค้าส้มตำ', 8],
      ['แพร', 'หลวงพี่', 7],
      ['ฟ้า', 'ป้าขี้เม้าท์', 6],
      ['มายด์', 'ร่างทรง', 5],
      ['เบียร์', 'คนเก็บค่าที่', 4],
      ['ต้น', 'นักล้วงกระเป๋า', 2]
    ];
    return {
      ranks: rows.map(function (r, i) {
        return {
          place: String(i + 1),
          name: r[0],
          card: 'เป็น ' + r[1],
          coins: r[2],
          bg: i === 0 ? '#3b2a1c' : '#211b40',
          nameColor: r[0] === 'ฉัน' ? '#ffd28a' : '#f3eefe'
        };
      })
    };
  }
}
</script>
</body>
</html>
