<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง อ้างตัวละคร</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; height: 44px;">
    <button style="height: 44px; padding: 0 12px 0 6px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      กลับ
    </button>
    <h1 style="margin: 0; flex-grow: 1; text-align: center; padding-right: 72px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">อ้างว่าเป็นใคร</h1>
  </header>

  <p style="margin: 0; text-align: center; font-size: 15px; color: #cfc6ee;">ตัวละครในเกมนี้ 10 ใบ · จะโกหกก็ได้</p>

  <fieldset style="margin: 0; padding: 0; border: none; flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 8px;">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden;">เลือกตัวละครที่จะอ้าง</legend>
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="10">
      <label style="box-sizing: border-box; border-radius: 14px; border: {{r.border}}; background: {{r.bg}}; opacity: {{r.opacity}}; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <input type="radio" name="claim" checked="{{r.checked}}" disabled="{{r.disabled}}" style="width: 18px; height: 18px; margin: 0; accent-color: #ffb547;">
          <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2;">{{r.name}}</span>
        </span>
        <span style="font-size: 13px; line-height: 1.35; color: #cfc6ee;">{{r.power}}</span>
      </label>
    </sc-for>
  </fieldset>

  <button style="height: 64px; flex-shrink: 0; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l7 5V5L6 10z"></path><path d="M17 8.5a5 5 0 0 1 0 7"></path></svg>
    ประกาศ: ฉันคือหมอดู
  </button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['แม่ค้าส้มตำ', 'รับ 2 ลูกค้ารับ 1'],
      ['นักล้วงกระเป๋า', 'ขโมย 2 จาก 1 คน'],
      ['ตำรวจ', 'ค้นตัว เจอขโมยยึด 4'],
      ['หมอดู', 'ดูการ์ด 2 คน รับ 1', true],
      ['หลวงพี่', 'ให้พร กันสลับ รับ 1'],
      ['นักมายากล', 'การ์ดทั้งวงขยับ 1 ที่'],
      ['คนเก็บค่าที่', 'เก็บ 1 จากคนที่รวยกว่า'],
      ['ร่างทรง', 'จ่าย 1 ใช้พลังตัวอื่น'],
      ['ป้าขี้เม้าท์', 'เปิดการ์ด 1 คนให้วงดู'],
      ['หมาวัด', 'อ้างไม่ได้', false, true]
    ];
    return {
      roles: list.map(function (r) {
        return {
          name: r[0],
          power: r[1],
          checked: !!r[2],
          disabled: !!r[3],
          border: r[2] ? '3px solid #ffb547' : '2px solid #3a3266',
          bg: r[2] ? '#3b2a1c' : '#211b40',
          opacity: r[3] ? '0.45' : '1'
        };
      })
    };
  }
}
</script>
</body>
</html>
