<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง แอบดู</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; height: 44px;">
    <h1 style="margin: 0; flex-grow: 1; text-align: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">แอบดู</h1>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: #cfc6ee;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6"></path><path d="M11 11V4a1.5 1.5 0 0 1 3 0v7"></path><path d="M14 11V5.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3 14a1.6 1.6 0 0 1 2.6-1.8L8 15"></path></svg>
    เอามือบังจอ คนข้างๆ อย่าแอบมอง
  </p>

  <section style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <article aria-label="การ์ดของคุณ นักล้วงกระเป๋า" style="width: 240px; height: 336px; box-sizing: border-box; border-radius: 22px; border: 4px solid #ffb547; background: #fff3d6; color: #241a3d; padding: 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <span style="font-size: 13px; font-weight: 700; color: #6b5a8e;">ตอนนี้คุณคือ</span>
      <div style="width: 116px; height: 116px; border-radius: 50%; background: #2b2150; color: #ffd76a; display: flex; align-items: center; justify-content: center;">
        <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6"></path><path d="M11 11V4a1.5 1.5 0 0 1 3 0v7"></path><path d="M14 11V5.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3 14a1.6 1.6 0 0 1 2.6-1.8L8 15"></path></svg>
      </div>
      <h2 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 32px; line-height: 1.1;">นักล้วงกระเป๋า</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; text-align: center;">ขโมย 2 เหรียญจากคนที่เลือก ถ้าเขาเป็นตำรวจตัวจริง คุณจ่ายเขา 3 แทน</p>
    </article>
  </section>

  <footer style="display: flex; flex-direction: column; gap: 8px;">
    <button style="position: relative; overflow: hidden; height: 72px; border-radius: 16px; border: 3px solid #ffb547; background: #3b2a1c; color: #ffd28a; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      กำลังดู · ปล่อยนิ้วเพื่อคว่ำ
    </button>
    <button style="height: 52px; border-radius: 14px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 17px;">ดูแล้ว จบตา</button>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 7, me: true, turn: true },
        { n: 'ก้อง', c: 9 },
        { n: 'มายด์', c: 4 },
        { n: 'บอส', c: 13, crown: true, near: true },
        { n: 'แพร', c: 6, shield: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 10 }
      ]
    };
  }
}
</script>
</body>
</html>
