<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง สลับ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; height: 44px;">
    <button style="height: 44px; padding: 0 12px 0 6px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      กลับ
    </button>
    <h1 style="margin: 0; flex-grow: 1; text-align: center; padding-right: 72px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">สลับ</h1>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <p style="margin: 0; text-align: center; font-size: 15px; color: #cfc6ee;">แตะชื่อเพื่อนในแถบเพื่อเลือก · <span style="display: inline-flex; align-items: center; gap: 3px; vertical-align: middle;"><svg width="14" height="14" viewBox="0 0 24 24" fill="#5cc8ff" aria-hidden="true"><path d="M12 2l8 3v6c0 5.5-3.5 9-8 11-4.5-2-8-5.5-8-11V5z"></path></svg>แพรได้รับพร</span> เลือกไม่ได้</p>

  <section aria-label="ฉันสลับกับมายด์" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div aria-hidden="true" style="width: 112px; height: 156px; box-sizing: border-box; border-radius: 14px; border: 3px solid #ffb547; background-color: #2b2150; background-image: repeating-linear-gradient(45deg, rgba(255,181,71,0.13) 0 8px, transparent 8px 16px), repeating-linear-gradient(-45deg, rgba(255,181,71,0.13) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 36px; color: #ffb547;">?</div>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px; color: #ffd28a;">ฉัน</span>
    </div>
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"></path><path d="M3 8h14"></path><path d="M17 20l4-4-4-4"></path><path d="M21 16H7"></path></svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div aria-hidden="true" style="width: 112px; height: 156px; box-sizing: border-box; border-radius: 14px; border: 3px solid #5cc8ff; background-color: #2b2150; background-image: repeating-linear-gradient(45deg, rgba(92,200,255,0.13) 0 8px, transparent 8px 16px), repeating-linear-gradient(-45deg, rgba(92,200,255,0.13) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 36px; color: #5cc8ff;">?</div>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px;">มายด์</span>
    </div>
  </section>

  <fieldset style="margin: 0; padding: 0; border: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <legend style="padding: 0 0 8px; font-size: 15px; color: #cfc6ee;">ทุกเครื่องเห็นแอนิเมชันเหมือนกัน ไม่มีใครรู้ว่าจริงไหม</legend>
    <label style="height: 76px; box-sizing: border-box; border-radius: 14px; border: 3px solid #ffb547; background: #3b2a1c; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px;">
      <input type="radio" name="swap" checked style="width: 22px; height: 22px; margin: 0; accent-color: #ffb547;">
      สลับจริง
    </label>
    <label style="height: 76px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3a3266; background: #211b40; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 20px;">
      <input type="radio" name="swap" style="width: 22px; height: 22px; margin: 0; accent-color: #ffb547;">
      แกล้งสลับ
    </label>
  </fieldset>

  <p style="margin: 0; text-align: center; font-size: 14px; color: #b3a9d6;">หลังสลับไม่มีใครเห็นการ์ด รวมถึงคุณ</p>

  <button style="height: 64px; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">ยืนยัน สลับกับมายด์</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 7, me: true, turn: true },
        { n: 'ก้อง', c: 9 },
        { n: 'มายด์', c: 4, picked: true },
        { n: 'บอส', c: 13, crown: true, near: true },
        { n: 'แพร', c: 6, shield: true, off: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 10 }
      ]
    };
  }
}
</script>
</body>
</html>
