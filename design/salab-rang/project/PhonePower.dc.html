<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง เลือกเป้าหมาย หมอดู</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="7"></circle><path d="M9 8a3 3 0 0 1 3-3"></path><path d="M7 16.5 5.5 21h13L17 16.5"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">พลังหมอดู</h1>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <p style="margin: 0; text-align: center; font-size: 16px; color: #cfc6ee;">แตะชื่อเพื่อน 2 คนที่จะดูการ์ด · <b style="color: #5cc8ff;">เลือกแล้ว 2/2</b></p>

  <section style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 16px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div aria-hidden="true" style="width: 132px; height: 184px; box-sizing: border-box; border-radius: 16px; border: 3px solid #5cc8ff; background-color: #2b2150; background-image: repeating-linear-gradient(45deg, rgba(92,200,255,0.13) 0 8px, transparent 8px 16px), repeating-linear-gradient(-45deg, rgba(92,200,255,0.13) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 40px; color: #5cc8ff;">?</div>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px;">มายด์</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div aria-hidden="true" style="width: 132px; height: 184px; box-sizing: border-box; border-radius: 16px; border: 3px solid #5cc8ff; background-color: #2b2150; background-image: repeating-linear-gradient(45deg, rgba(92,200,255,0.13) 0 8px, transparent 8px 16px), repeating-linear-gradient(-45deg, rgba(92,200,255,0.13) 0 8px, transparent 8px 16px); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 40px; color: #5cc8ff;">?</div>
      <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px;">บอส</span>
    </div>
  </section>

  <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: #b3a9d6;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    ผลเห็นแค่บนเครื่องคุณ เจ้าของการ์ดไม่เห็น
  </p>
  <button style="height: 64px; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">ดูการ์ดมายด์ และบอส</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 7, me: true, turn: true, off: true },
        { n: 'ก้อง', c: 8 },
        { n: 'มายด์', c: 4, picked: true },
        { n: 'บอส', c: 13, crown: true, near: true, picked: true },
        { n: 'แพร', c: 6, shield: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
