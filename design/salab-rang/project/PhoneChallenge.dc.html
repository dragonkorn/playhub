<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง ช่วงท้า</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; height: 44px;">
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">รอบ 2<span style="color: #b3a9d6; font-weight: 500;">/4</span> <span style="color: #b3a9d6; font-weight: 500; font-size: 16px;">· เป้า 15</span></h1>
    <button aria-label="ประวัติ" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    </button>
    <button aria-label="คู่มือตัวละคร" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"></path><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"></path></svg>
    </button>
    <button aria-label="ปิดเสียง" style="width: 44px; height: 44px; border-radius: 10px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
    </button>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <section aria-live="polite" style="flex-grow: 1; border-radius: 20px; border: 3px solid #ffb547; background: #2c2456; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l7 5V5L6 10z"></path><path d="M17 8.5a5 5 0 0 1 0 7"></path></svg>
    <p style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 20px;">ก้อง อ้างว่าเป็น</p>
    <p style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 52px; line-height: 1; color: #ffd28a;">หมอดู</p>
    <p style="margin: 0; font-size: 15px; color: #cfc6ee;">ดูการ์ดของเพื่อน 2 คน แล้วรับ 1 เหรียญ</p>
    <p style="margin: 8px 0 0; height: 32px; padding: 0 14px; border-radius: 16px; background: #15112b; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      ตอบแล้ว 6 จาก 9 คน
    </p>
  </section>

  <footer style="display: flex; flex-direction: column; gap: 8px;">
    <p style="margin: 0; text-align: center; font-size: 14px; color: #cfc6ee;">คุณเลือก <b style="color: #ffd28a;">ผ่าน</b> · เปลี่ยนใจได้จนกว่าทุกคนตอบครบ</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <button aria-pressed="false" style="height: 72px; border-radius: 16px; border: 2px solid #8b7fd0; background: transparent; color: #f3eefe; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">ฉันต่างหาก!</button>
      <button aria-pressed="true" style="height: 72px; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        ผ่าน
      </button>
    </div>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 7, me: true, check: true },
        { n: 'ก้อง', c: 9, turn: true },
        { n: 'มายด์', c: 4, check: true },
        { n: 'บอส', c: 13, crown: true, near: true },
        { n: 'แพร', c: 6, shield: true, check: true },
        { n: 'ต้น', c: 5, check: true },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์ช้างน้อย', c: 3, check: true },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 10, check: true }
      ]
    };
  }
}
</script>
</body>
</html>
