<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง iPad ตาของเรา</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 1180px; height: 820px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; height: 48px;">
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 26px;">รอบ 2<span style="color: #b3a9d6; font-weight: 500;">/4</span> <span style="color: #b3a9d6; font-weight: 500; font-size: 18px;">· เป้า 15 เหรียญ</span></h1>
    <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      ประวัติ
    </button>
    <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"></path><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"></path></svg>
      คู่มือตัวละคร
    </button>
    <button aria-label="ปิดเสียง" style="width: 48px; height: 48px; border-radius: 12px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
    </button>
  </header>

  <dc-import name="Strip" rows="{{rows}}" columns="{{ten}}" hint-size="1132px,58px"></dc-import>

  <section style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
    <div style="border-radius: 24px; background: #1b1636; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
      <div role="img" aria-label="การ์ดของคุณ คว่ำอยู่" style="width: 300px; height: 420px; box-sizing: border-box; border-radius: 26px; border: 5px solid #ffb547; background-color: #2b2150; background-image: repeating-linear-gradient(45deg, rgba(255,181,71,0.13) 0 12px, transparent 12px 24px), repeating-linear-gradient(-45deg, rgba(255,181,71,0.13) 0 12px, transparent 12px 24px); display: flex; align-items: center; justify-content: center;">
        <div style="width: 150px; height: 150px; box-sizing: border-box; border-radius: 50%; background: #15112b; border: 4px solid #ffb547; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <span style="font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; color: #ffb547;">?</span>
          <span style="font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 16px; color: #ffd28a;">สลับร่าง</span>
        </div>
      </div>
      <span style="font-size: 15px; color: #b3a9d6;">การ์ดของคุณ · คว่ำอยู่</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <p style="margin: 0; align-self: flex-start; height: 40px; padding: 0 18px; border-radius: 20px; background: #ffb547; color: #241a3d; display: flex; align-items: center; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 19px;">ตาของคุณ · เลือก 1 ท่า</p>
      <nav aria-label="ท่าในตานี้" style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
        <button style="flex-grow: 1; border-radius: 18px; border: 2px solid #ffb547; background: #2c2456; color: #f3eefe; padding: 0 24px; display: flex; align-items: center; gap: 18px; text-align: left; font-family: 'Sarabun', sans-serif;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"></path><path d="M3 8h14"></path><path d="M17 20l4-4-4-4"></path><path d="M21 16H7"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1;">สลับ</span><span style="font-size: 16px; color: #cfc6ee;">สลับจริงหรือแกล้งสลับ กับเพื่อน 1 คน</span></span>
        </button>
        <button style="flex-grow: 1; border-radius: 18px; border: 2px solid #ffb547; background: #2c2456; color: #f3eefe; padding: 0 24px; display: flex; align-items: center; gap: 18px; text-align: left; font-family: 'Sarabun', sans-serif;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1;">แอบดู</span><span style="font-size: 16px; color: #cfc6ee;">กดค้างดูการ์ดตัวเอง</span></span>
        </button>
        <button style="flex-grow: 1; border-radius: 18px; border: 2px solid #ffb547; background: #2c2456; color: #f3eefe; padding: 0 24px; display: flex; align-items: center; gap: 18px; text-align: left; font-family: 'Sarabun', sans-serif;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l7 5V5L6 10z"></path><path d="M17 8.5a5 5 0 0 1 0 7"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1;">อ้าง</span><span style="font-size: 16px; color: #cfc6ee;">บอกว่าเป็นใคร แล้วใช้พลัง</span></span>
        </button>
      </nav>
      <p style="margin: 0; border-radius: 14px; background: #211b40; padding: 14px 16px; font-size: 15px; color: #cfc6ee;">ล่าสุด: นัทสลับกับมายด์ (จริงหรือแกล้ง ไม่มีใครรู้)</p>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ten: 10,
      rows: [
        { n: 'ฉัน', c: 7, me: true, turn: true },
        { n: 'ก้อง', c: 9 },
        { n: 'มายด์', c: 4 },
        { n: 'บอส', c: 13, crown: true, near: true },
        { n: 'แพร', c: 6, shield: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 10 }
      ]
    };
  }
}
</script>
</body>
</html>
