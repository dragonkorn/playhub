<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง พลังร่างทรง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M3 12h4"></path><path d="M17 12h4"></path><path d="M6 6l2.5 2.5"></path><path d="M15.5 15.5 18 18"></path><path d="M6 18l2.5-2.5"></path><path d="M15.5 8.5 18 6"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">ร่างทรง · เลือกร่าง</h1>
  </header>

  <ol aria-label="ขั้นตอน" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
    <li style="height: 36px; border-radius: 10px; background: #ffb547; color: #241a3d; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">1 เลือกร่าง</li>
    <li style="height: 36px; border-radius: 10px; border: 2px solid #3a3266; box-sizing: border-box; color: #cfc6ee; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">2 ใช้พลังร่างนั้น</li>
  </ol>

  <p style="margin: 0; text-align: center; font-size: 15px; color: #cfc6ee;">จ่าย 1 เหรียญ แล้วใช้พลังตัวละครอื่นในเกมนี้ 1 ครั้ง</p>

  <fieldset style="margin: 0; padding: 0; border: none; flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 8px;">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden;">เลือกตัวละครที่จะเข้าร่าง</legend>
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="8">
      <label style="box-sizing: border-box; border-radius: 14px; border: {{r.border}}; background: {{r.bg}}; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <input type="radio" name="medium" checked="{{r.checked}}" style="width: 18px; height: 18px; margin: 0; accent-color: #ffb547;">
          <span style="font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2;">{{r.name}}</span>
        </span>
        <span style="font-size: 13px; line-height: 1.35; color: #cfc6ee;">{{r.power}}</span>
      </label>
    </sc-for>
  </fieldset>

  <p style="margin: 0; text-align: center; font-size: 14px; color: #b3a9d6;">ร่างทรงและหมาวัดเลือกไม่ได้</p>
  <button style="height: 64px; flex-shrink: 0; border-radius: 16px; border: none; background: #ffb547; color: #241a3d; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 21px;">จ่าย 1 เข้าร่างตำรวจ</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['แม่ค้าส้มตำ', 'รับ 2 ลูกค้ารับ 1'],
      ['นักล้วงกระเป๋า', 'ขโมย 2 จาก 1 คน'],
      ['ตำรวจ', 'ค้นตัว เจอขโมยยึด 4', true],
      ['หมอดู', 'ดูการ์ด 2 คน รับ 1'],
      ['หลวงพี่', 'ให้พร กันสลับ รับ 1'],
      ['นักมายากล', 'การ์ดทั้งวงขยับ 1 ที่'],
      ['คนเก็บค่าที่', 'เก็บ 1 จากคนที่รวยกว่า'],
      ['ป้าขี้เม้าท์', 'เปิดการ์ด 1 คนให้วงดู']
    ];
    return {
      roles: list.map(function (r) {
        return {
          name: r[0],
          power: r[1],
          checked: !!r[2],
          border: r[2] ? '3px solid #ffb547' : '2px solid #3a3266',
          bg: r[2] ? '#3b2a1c' : '#211b40'
        };
      })
    };
  }
}
</script>
</body>
</html>
