<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สลับร่าง หมอนวดให้ดูการ์ด</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;900&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15112b}
a{color:#ffb547}a:hover{color:#ffd28a}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #15112b; color: #f3eefe; font-family: 'Sarabun', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"></path><path d="M5 19 13 11"></path></svg>
    <h1 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px;">แพรนวดให้คุณ</h1>
  </header>

  <dc-import name="Strip" rows="{{rows}}" hint-size="358px,122px"></dc-import>

  <p style="margin: 0; align-self: center; height: 36px; padding: 0 16px; border-radius: 18px; background: #3a1d18; color: #ffd9cc; display: flex; align-items: center; gap: 6px; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px;">
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd76a"></circle><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87412" stroke-width="2.5"></circle></svg>
    ค่านวด −1 เหรียญ ให้แพร
  </p>

  <section style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
    <span style="font-size: 15px; color: #cfc6ee;">ของแถม: ดูการ์ดตัวเองฟรี 1 ครั้ง</span>
    <article aria-label="การ์ดของคุณ หลวงพี่" style="width: 230px; height: 322px; box-sizing: border-box; border-radius: 22px; border: 4px solid #5cc8ff; background: #fff3d6; color: #241a3d; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <span style="font-size: 13px; font-weight: 700; color: #6b5a8e;">ตอนนี้คุณคือ</span>
      <div style="width: 110px; height: 110px; border-radius: 50%; background: #2b2150; color: #ffd76a; display: flex; align-items: center; justify-content: center;">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-8-3-8-7 3 0 6 2 8 5 2-3 5-5 8-5 0 4-4 7-8 7z"></path><path d="M12 18c-2-3-2-8 0-12 2 4 2 9 0 12z"></path></svg>
      </div>
      <h2 style="margin: 0; font-family: 'Kanit', sans-serif; font-weight: 900; font-size: 38px; line-height: 1.1;">หลวงพี่</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; text-align: center;">ให้พร 1 คน ห้ามใครสลับกับเขา รับ 1 เหรียญ</p>
    </article>
    <span style="font-size: 14px; color: #b3a9d6;">เห็นแค่คุณ · เอามือบังจอ</span>
  </section>

  <footer style="display: flex; flex-direction: column; gap: 8px;">
    <button style="height: 64px; border-radius: 16px; border: 3px solid #5cc8ff; background: #173049; color: #c4ecff; font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      กำลังดู · ปล่อยนิ้วเพื่อคว่ำ
    </button>
    <button style="height: 52px; border-radius: 14px; border: 2px solid #3a3266; background: transparent; color: #f3eefe; font-family: 'Sarabun', sans-serif; font-weight: 700; font-size: 17px;">ดูแล้ว</button>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { n: 'ฉัน', c: 6, me: true, picked: true },
        { n: 'ก้อง', c: 9 },
        { n: 'มายด์', c: 4 },
        { n: 'บอส', c: 13, crown: true, near: true },
        { n: 'แพร', c: 7, shield: true, turn: true },
        { n: 'ต้น', c: 5 },
        { n: 'จูน', c: 8, lock: true },
        { n: 'เบียร์ช้างน้อย', c: 3 },
        { n: 'ฟ้า', c: 6 },
        { n: 'นัท', c: 10 }
      ]
    };
  }
}
</script>
</body>
</html>
