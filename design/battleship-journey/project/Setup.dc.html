<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Place your fleet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1A2B}
a{color:#FFC83D}a:hover{color:#FFE08A}
</style>
</helmet>
<main style="width: 1180px; height: 820px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #0B1A2B; color: #EAF2F6; font-family: 'DM Sans', sans-serif">
  <header style="height: 64px; display: flex; justify-content: space-between; align-items: center; gap: 24px">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 44px; text-transform: uppercase">Place your fleet</h1>
    <p style="margin: 0; font-size: 18px; color: #9DB4C4">Everyone places at the same time</p>
  </header>
  <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 250px 584px 250px; justify-content: space-between">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #9DB4C4">Your ships</h2>
      <sc-for list="{{fleet}}" as="s" hint-placeholder-count="5">
        <div style="box-sizing: border-box; min-height: 72px; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px; background: #12263B; border: 2px solid {{s.border}}; border-radius: 12px">
          <span style="font-size: 18px; font-weight: 500">{{s.name}}</span>
          <span style="display: flex; gap: 3px">
            <sc-for list="{{s.pips}}" as="pip" hint-placeholder-count="3">
              <span style="width: 22px; height: 12px; background: #6E8FA8; border-radius: 2px"></span>
            </sc-for>
          </span>
        </div>
      </sc-for>
    </section>
    <section style="display: flex; flex-direction: column; gap: 16px">
      <dc-import name="Board" cell="54" ships="{{ ships }}" hint-size="584px,580px"></dc-import>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <button type="button" style="height: 64px; background: #12263B; color: #EAF2F6; border: 2px solid #27425C; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700">Rotate</button>
        <button type="button" style="height: 64px; background: #12263B; color: #EAF2F6; border: 2px solid #27425C; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 700">Shuffle</button>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #9DB4C4">Players</h2>
      <sc-for list="{{players}}" as="p" hint-placeholder-count="3">
        <div style="box-sizing: border-box; height: 56px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; background: #12263B; border-radius: 12px; font-size: 18px">
          <span style="font-weight: 500">{{p.name}}</span>
          <span style="font-size: 16px; color: #9DB4C4">{{p.status}}</span>
        </div>
      </sc-for>
      <a href="Battle.dc.html" style="margin-top: auto; box-sizing: border-box; height: 80px; display: flex; align-items: center; justify-content: center; background: #FFC83D; color: #0B1A2B; border-radius: 16px; font-size: 26px; font-weight: 700; text-decoration: none">Ready</a>
    </section>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const fleet = [
      { name: 'Carrier', len: 5 },
      { name: 'Battleship', len: 4 },
      { name: 'Cruiser', len: 3 },
      { name: 'Submarine', len: 3 },
      { name: 'Destroyer', len: 2, active: true },
    ];
    return {
      fleet: fleet.map((s) => ({
        ...s,
        pips: Array.from({ length: s.len }, (_, i) => ({ i })),
        border: s.active ? '#FFC83D' : 'transparent',
      })),
      ships: [
        { r: 0, c: 1, len: 5, name: 'Carrier', art: '/_blob/86431cd17374477e3f855c592209654f' },
        { r: 2, c: 8, len: 4, v: true, name: 'Battleship', art: '/_blob/e1e61c0d152095572bfe21e619da86fe' },
        { r: 4, c: 2, len: 3, v: true, name: 'Cruiser', art: '/_blob/f27facd964156f71290ef1e568f52ca4' },
        { r: 8, c: 4, len: 3, name: 'Submarine', art: '/_blob/9663be28225346d05a6d936a7815c9e2' },
        { r: 5, c: 5, len: 2, name: 'Destroyer', art: '/_blob/d3045ec74297d167f3430c8c131114ea' },
      ],
      players: [
        { name: 'Mina', status: 'Placing' },
        { name: 'Arm', status: 'Ready' },
        { name: 'Ploy', status: 'Placing' },
      ],
    };
  }
}
</script>
</body>
</html>
