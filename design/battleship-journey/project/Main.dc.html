<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlayHub main page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1A2B}
a{color:#FFC83D}a:hover{color:#FFE08A}
</style>
</helmet>
<main style="width: 1180px; height: 820px; box-sizing: border-box; padding: 56px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; background: #0B1A2B; color: #EAF2F6; font-family: 'DM Sans', sans-serif">
  <section style="display: flex; flex-direction: column; justify-content: space-between; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 132px; line-height: 0.9; letter-spacing: 1px; text-transform: uppercase">Play<br>Hub</h1>
      <p style="margin: 0; font-size: 26px; line-height: 1.35; color: #9DB4C4">Pick a game. Share a code.<br>Play together in seconds.</p>
    </div>
    <dc-import name="Board" cell="30" labels="{{ false }}" ships="{{ ships }}" hits="{{ hits }}" misses="{{ misses }}" hint-size="318px,318px"></dc-import>
  </section>
  <section style="display: flex; flex-direction: column; gap: 20px">
    <h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #9DB4C4">Choose a game</h2>
    <div style="box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 8px; background: #12263B; border: 3px solid #FFC83D; border-radius: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
        <h3 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 44px; text-transform: uppercase">Battleship</h3>
        <span style="font-size: 16px; font-weight: 500; color: #9DB4C4">2–10 players</span>
      </div>
      <p style="margin: 0; font-size: 18px; line-height: 1.4; color: #9DB4C4">Hide your fleet. Last fleet afloat wins.</p>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
      <a href="Lobby.dc.html" style="box-sizing: border-box; height: 80px; display: flex; align-items: center; justify-content: center; background: #FFC83D; color: #0B1A2B; border-radius: 16px; font-size: 26px; font-weight: 700; text-decoration: none">Create room</a>
      <a href="Join.dc.html" style="box-sizing: border-box; height: 80px; display: flex; align-items: center; justify-content: center; background: #12263B; color: #EAF2F6; border: 2px solid #27425C; border-radius: 16px; font-size: 26px; font-weight: 700; text-decoration: none">Join with code</a>
    </div>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ships: [
        { r: 1, c: 1, len: 5, name: 'Carrier', art: '/_blob/86431cd17374477e3f855c592209654f' },
        { r: 3, c: 7, len: 4, v: true, name: 'Battleship', art: '/_blob/e1e61c0d152095572bfe21e619da86fe' },
        { r: 6, c: 2, len: 3, name: 'Cruiser', art: '/_blob/f27facd964156f71290ef1e568f52ca4' },
      ],
      hits: ['1,2', '1,3', '4,7'],
      misses: ['0,6', '5,4', '8,8', '2,4'],
    };
  }
}
</script>
</body>
</html>
