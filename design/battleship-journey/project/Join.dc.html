<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join a room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1A2B}
a{color:#FFC83D}a:hover{color:#FFE08A}
</style>
</helmet>
<main style="width: 1180px; height: 820px; box-sizing: border-box; padding: 40px 56px 56px; display: flex; flex-direction: column; gap: 40px; background: #0B1A2B; color: #EAF2F6; font-family: 'DM Sans', sans-serif">
  <a href="Main.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; font-size: 20px; font-weight: 500; color: #9DB4C4; text-decoration: none">Back</a>
  <section style="width: 560px; align-self: center; display: flex; flex-direction: column; gap: 32px">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; text-transform: uppercase; text-align: center">Join room</h1>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="code" style="font-size: 18px; font-weight: 700; color: #9DB4C4">Room code</label>
      <input id="code" value="K7Q2" maxlength="4" autocomplete="off" style="box-sizing: border-box; width: 100%; height: 112px; padding: 0; background: #12263B; border: 3px solid #FFC83D; border-radius: 16px; color: #EAF2F6; text-align: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: 20px; text-transform: uppercase">
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="name" style="font-size: 18px; font-weight: 700; color: #9DB4C4">Your name</label>
      <input id="name" value="Mina" maxlength="16" autocomplete="off" style="box-sizing: border-box; width: 100%; height: 72px; padding: 0 20px; background: #12263B; border: 2px solid #27425C; border-radius: 16px; color: #EAF2F6; font-family: 'DM Sans', sans-serif; font-size: 26px">
    </div>
    <a href="Lobby.dc.html" style="box-sizing: border-box; height: 80px; display: flex; align-items: center; justify-content: center; background: #FFC83D; color: #0B1A2B; border-radius: 16px; font-size: 26px; font-weight: 700; text-decoration: none">Join</a>
    <p style="margin: 0; font-size: 18px; text-align: center; color: #9DB4C4">Scanned a QR code? The room code is already filled in.</p>
  </section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
